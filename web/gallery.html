<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>服装资产图库｜8 大品类 · 1400+ 张服装参考图</title>
<meta name="description" content="本地中文服装资产图库，覆盖内衣、春夏秋冬、性感、泳装、派对等品类，支持按品类筛选与搜索，可一键选用到 ComfyUI。">
<meta name="theme-color" content="#f5f7fb">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23c2569b'/%3E%3Cpath d='M11 7l5-2 5 2 4 3-2 3-2-1v11h-6V12l-2 1-2-3z' fill='white'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f5f7fb;--surface:#fff;--surface-2:#f8f9fc;--text:#171a21;--text-2:#5d6472;
  --text-3:#8a919f;--line:#e5e8ef;--line-strong:#d6dbe5;--accent:#c2569b;
  --accent-dark:#a83f82;--accent-soft:#fbeef6;--shadow:0 14px 40px rgba(28,35,60,.09);
  --radius:16px;--font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 var(--font);-webkit-font-smoothing:antialiased}
body.viewer-open{overflow:hidden}
button,input{font:inherit}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid rgba(194,86,155,.28);outline-offset:2px}
.shell{width:min(1560px,calc(100% - 64px));margin-inline:auto}
.site-header{position:relative;overflow:hidden;background:var(--surface);border-bottom:1px solid var(--line)}
.site-header::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(700px 260px at 80% 0,rgba(194,86,155,.09),transparent 70%),radial-gradient(500px 220px at 4% 100%,rgba(91,91,214,.06),transparent 70%)}
.hero{position:relative;display:flex;align-items:center;justify-content:space-between;gap:40px;padding:34px 0 32px}
.brand{display:flex;align-items:center;gap:11px;text-decoration:none;margin-bottom:14px}
.brand-mark{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,#d76fb0,#a83f82);box-shadow:0 6px 16px rgba(194,86,155,.22)}
.brand-copy{display:flex;flex-direction:column;line-height:1.2}
.brand-copy strong{font-size:15px;letter-spacing:.02em}
.brand-copy span{font-size:10px;color:var(--text-3);letter-spacing:.16em;text-transform:uppercase;margin-top:4px}
.eyebrow{margin:0 0 8px;color:var(--accent);font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}
.hero h1{margin:0;font-size:clamp(28px,3vw,40px);line-height:1.2;letter-spacing:-.035em;font-weight:800}
.hero h1 .hero-tagline{display:block;margin-top:7px;color:var(--text-2);font-size:15px;font-weight:500;letter-spacing:0;line-height:1.4}
.hero-desc{max-width:740px;margin:12px 0 0;color:var(--text-2);font-size:14px;line-height:1.8}
.hero-stats{display:flex;align-items:center;flex:0 0 auto}
.stat{min-width:104px;padding:4px 26px;border-left:1px solid var(--line)}
.stat:first-child{border-left:0}
.stat strong{display:block;font-size:27px;line-height:1.2;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.stat span{display:block;margin-top:6px;font-size:12px;color:var(--text-3)}
.controls{position:sticky;top:0;z-index:30;background:rgba(245,247,251,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.controls-inner{padding:14px 0 12px}
.line-tabs{display:flex;gap:8px;overflow-x:auto;padding:1px 1px 4px;scrollbar-width:none}
.line-tabs::-webkit-scrollbar{display:none}
.line-tab{flex:0 0 auto;min-height:48px;padding:7px 17px;border:1px solid var(--line-strong);border-radius:12px;background:var(--surface);cursor:pointer;text-align:left;transition:border-color .16s,background .16s,color .16s}
.line-tab:hover{border-color:#e0b8d4}
.line-tab[aria-selected="true"]{background:var(--text);border-color:var(--text);color:#fff}
.tab-name{display:block;font-size:13px;font-weight:700;white-space:nowrap}
.tab-count{display:block;margin-top:1px;font-size:10px;color:var(--text-3);white-space:nowrap;font-variant-numeric:tabular-nums}
.line-tab[aria-selected="true"] .tab-count{color:#c9b3bf}
.search-row{display:flex;gap:10px;margin-top:10px}
.search-box{position:relative;flex:1;display:flex;align-items:center}
.search-box>svg{position:absolute;left:15px;color:var(--text-3);pointer-events:none}
.search-box input{width:100%;height:46px;border:1px solid var(--line-strong);border-radius:12px;background:var(--surface);padding:0 76px 0 43px;color:var(--text);font-size:14px;outline:none;transition:border-color .16s,box-shadow .16s}
.search-box input::placeholder{color:#9ba2af}
.search-box input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(194,86,155,.10)}
.search-clear{position:absolute;right:13px;width:28px;height:28px;border:0;border-radius:50%;background:var(--surface-2);color:var(--text-2);cursor:pointer;display:grid;place-items:center}
.search-clear:hover{background:var(--line)}
main{padding:22px 0 54px}
.result-head{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:15px;min-height:30px}
.result-summary strong{font-size:15px;font-variant-numeric:tabular-nums}
.result-summary span{font-size:12px;color:var(--text-3)}
.result-hint{color:var(--text-3);font-size:12px;display:flex;align-items:center;gap:6px}
.active-filters{display:flex;gap:7px;flex-wrap:wrap;margin:-3px 0 15px}
.filter-chip{height:28px;padding:0 9px;border:1px solid #f0d2e6;border-radius:8px;background:var(--accent-soft);color:var(--accent-dark);display:inline-flex;align-items:center;gap:6px;font-size:11px;cursor:pointer}
.filter-chip::after{content:"×";font-size:15px;line-height:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px}
.asset-card{min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;cursor:zoom-in;transition:transform .18s,box-shadow .18s,border-color .18s;outline:none}
.asset-card:hover,.asset-card:focus-visible{transform:translateY(-3px);border-color:#e3c2d8;box-shadow:var(--shadow)}
.card-image{position:relative;aspect-ratio:2/3;overflow:hidden;background:#f8f9fb}
.main-image{display:block;width:100%;height:100%;object-fit:cover;transition:transform .35s ease,opacity .18s}
.asset-card:hover .main-image{transform:scale(1.03)}
.image-top{position:absolute;inset:10px 10px auto;display:flex;justify-content:flex-end;pointer-events:none}
.cat-tag{display:inline-flex;align-items:center;min-height:24px;padding:0 8px;border-radius:7px;background:rgba(255,255,255,.92);color:var(--text);border:1px solid rgba(229,232,239,.8);font-size:10px;font-weight:700}
.zoom-hint{position:absolute;right:10px;bottom:10px;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:rgba(255,255,255,.9);color:var(--text-2);box-shadow:0 3px 12px rgba(20,25,40,.10);opacity:0;transform:translateY(4px);transition:.18s;pointer-events:none}
.asset-card:hover .zoom-hint{opacity:1;transform:none}
.card-body{padding:13px 14px 14px}
.card-body h3{margin:0;font-size:14px;line-height:1.5;font-weight:700}
.card-id{display:block;margin-top:6px;color:var(--text-3);font:10px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.load-more{display:flex;align-items:center;justify-content:center;gap:8px;min-width:220px;height:46px;margin:28px auto 0;padding:0 22px;border:1px solid var(--line-strong);border-radius:12px;background:var(--surface);color:var(--text);font-weight:700;cursor:pointer;box-shadow:0 3px 10px rgba(28,35,60,.03)}
.load-more:hover{border-color:var(--accent);color:var(--accent)}
.empty{grid-column:1/-1;padding:80px 20px;text-align:center;background:var(--surface);border:1px dashed var(--line-strong);border-radius:var(--radius)}
.empty-icon{width:52px;height:52px;margin:0 auto 14px;border-radius:15px;background:var(--surface-2);display:grid;place-items:center;color:var(--text-3)}
.empty h3{margin:0 0 6px;font-size:17px}
.empty p{margin:0 0 18px;color:var(--text-2)}
.empty button{height:40px;padding:0 18px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-weight:700;cursor:pointer}
.skeleton{pointer-events:none}
.skeleton .card-image,.skeleton-line{background:linear-gradient(90deg,#edf0f5 25%,#f7f8fb 50%,#edf0f5 75%);background-size:200% 100%;animation:shimmer 1.4s infinite}
.skeleton-line{height:12px;margin:14px;border-radius:6px}
.skeleton-line.short{width:55%;margin-top:0}
@keyframes shimmer{to{background-position:-200% 0}}
.viewer{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:28px;background:rgba(15,18,28,.76);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.viewer-panel{position:relative;width:min(1180px,100%);height:min(850px,92dvh);display:grid;grid-template-columns:minmax(0,1fr) 330px;background:var(--surface);border-radius:20px;overflow:hidden;box-shadow:0 28px 90px rgba(0,0,0,.35)}
.viewer-stage{position:relative;min-width:0;min-height:0;display:grid;place-items:center;background:#eef0f4;overflow:hidden;touch-action:pan-y}
.viewer-image{position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none}
.viewer-image.is-loading{opacity:.72}
.image-status{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);padding:5px 11px;border-radius:99px;background:rgba(23,26,33,.72);color:#fff;font-size:11px;pointer-events:none}
.viewer-close{position:absolute;right:14px;top:14px;z-index:4;width:42px;height:42px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.94);color:var(--text);display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 16px rgba(20,25,40,.08)}
.viewer-close:hover{background:#fff;color:var(--accent)}
.viewer-side{min-height:0;display:flex;flex-direction:column;gap:18px;padding:28px 24px 22px;overflow-y:auto;border-left:1px solid var(--line)}
.viewer-eyebrow{display:flex;align-items:center;justify-content:space-between;gap:10px;color:var(--accent);font-size:11px;font-weight:800;letter-spacing:.1em}
.viewer-position{color:var(--text-3);font-weight:500;letter-spacing:0;font-variant-numeric:tabular-nums}
.viewer-heading h2{margin:8px 0 9px;font-size:20px;line-height:1.45;letter-spacing:-.01em}
.id-row{display:flex;align-items:center;gap:7px;min-width:0}
.viewer-id{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-3);font:10px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}
.copy-btn{flex:0 0 auto;border:0;background:transparent;color:var(--accent);font-size:11px;cursor:pointer;padding:2px 4px}
.metadata{display:grid;grid-template-columns:70px 1fr;gap:8px 12px;margin:0;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:12px}
.metadata dt{color:var(--text-3)}
.metadata dd{margin:0;color:var(--text);font-weight:600;word-break:break-word}
.download-stack{display:grid;gap:9px}
.download-btn,.open-btn{min-height:44px;border-radius:11px;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;font-size:13px;font-weight:800;cursor:pointer}
.download-btn{border:1px solid var(--accent);background:var(--accent);color:#fff}
.download-btn:hover{background:var(--accent-dark)}
.open-btn{border:1px solid var(--line-strong);background:var(--surface);color:var(--text-2)}
.open-btn:hover{border-color:var(--accent);color:var(--accent)}
.keyboard-help{margin-top:auto;color:var(--text-3);font-size:10px;line-height:2}
.keyboard-help kbd{display:inline-block;min-width:20px;padding:0 4px;border:1px solid var(--line-strong);border-radius:4px;background:var(--surface-2);color:var(--text-2);font:10px/18px var(--font);text-align:center}
.info-dialog{width:min(580px,calc(100% - 32px));max-height:min(760px,86dvh);padding:0;border:1px solid var(--line);border-radius:18px;background:var(--surface);color:var(--text);box-shadow:0 24px 80px rgba(15,20,35,.22);overflow:auto}
.info-dialog::backdrop{background:rgba(15,18,28,.55);backdrop-filter:blur(5px)}
.info-dialog:focus{outline:none}
.info-head{position:sticky;top:0;z-index:1;display:flex;align-items:center;justify-content:space-between;padding:18px 22px;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line)}
.info-head h2{margin:0;font-size:18px}
.info-close{width:34px;height:34px;border:0;border-radius:9px;background:var(--surface-2);display:grid;place-items:center;cursor:pointer}
.info-content{padding:20px 24px 24px;color:var(--text-2);font-size:13px;line-height:1.9}
.info-content ul{margin:0;padding-left:1.35em}
.info-content li+li{margin-top:9px}
.info-content strong{color:var(--text)}
@media(max-width:1180px){.shell{width:min(1560px,calc(100% - 40px))}.hero-stats .stat{min-width:86px;padding-inline:18px}.grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}}
@media(max-width:860px){.hero{gap:20px}.stat{min-width:76px!important;padding-inline:14px!important}.stat strong{font-size:23px}.viewer-panel{grid-template-columns:minmax(0,1fr) 285px}.viewer-side{padding:24px 18px 18px}}
@media(max-width:680px){.shell{width:calc(100% - 24px)}.hero{display:block;padding:23px 0 21px}.hero h1{font-size:27px}.hero-desc{margin-top:9px;font-size:12px;line-height:1.75}.hero-stats{margin-top:20px;padding-top:15px;border-top:1px solid var(--line);justify-content:space-between}.hero-stats .stat{flex:1;min-width:0!important;padding:0 14px!important;text-align:center}.hero-stats .stat:first-child{padding-left:0!important;text-align:left}.hero-stats .stat:last-child{padding-right:0!important;text-align:right}.stat strong{font-size:21px}.controls-inner{padding:10px 0}.line-tabs{gap:6px;padding-bottom:2px}.line-tab{min-height:44px;padding:5px 12px;border-radius:10px}.tab-name{font-size:12px}.tab-count{font-size:9px}.search-row{margin-top:8px;gap:8px}.search-box input{height:44px;padding-left:39px;padding-right:40px;font-size:13px}.search-box>svg{left:13px}.search-clear{right:8px}main{padding-top:16px}.result-head{margin-bottom:12px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.asset-card{border-radius:12px}.asset-card:hover{transform:none}.image-top{inset:7px 7px auto}.cat-tag{min-height:21px;padding:0 6px;font-size:9px;border-radius:6px}.zoom-hint{display:none}.card-body{padding:10px 10px 8px}.card-body h3{font-size:12px;line-height:1.5}.card-id{font-size:8px;margin-top:4px}.load-more{width:100%;margin-top:20px}.empty{padding:55px 16px}.viewer{padding:0;place-items:stretch}.viewer-panel{width:100%;height:100dvh;max-height:none;border-radius:0;grid-template-columns:1fr;grid-template-rows:minmax(280px,52dvh) minmax(0,1fr)}.viewer-stage{min-height:0}.viewer-side{gap:15px;padding:18px 16px calc(20px + env(safe-area-inset-bottom));border-left:0;border-top:1px solid var(--line)}.viewer-heading h2{font-size:17px;margin:6px 0 7px}.viewer-close{right:10px;top:10px;width:38px;height:38px;border-radius:10px}.metadata{grid-template-columns:62px 1fr;padding:11px 0;gap:6px 10px}.keyboard-help{display:none}.download-stack{grid-template-columns:1fr 1fr}.download-btn,.open-btn{font-size:12px;min-height:44px}.info-content{padding:18px 20px 22px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="site-header">
  <div class="shell hero">
    <div>
      <a class="brand" href="./gallery" aria-label="返回服装资产图库首页">
        <span class="brand-mark"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 4 12 3l3.5 1L20 7l-1.5 2.4L17 8v9h-3V12l-1.5 1L11 12v5H8V8L5.5 9.4 4 7z"/></svg></span>
        <span class="brand-copy"><strong>Clothing Atlas</strong><span>Asset Library</span></span>
      </a>
      <p class="eyebrow">CLOTHING ASSET · 中文服装图库</p>
      <h1>服装资产图库<span class="hero-tagline">为 AI 出图提供可靠的服装参考</span></h1>
      <p class="hero-desc">本地服装参考图，覆盖季节、场景与品类。按品类筛选、搜索，一键选用到 ComfyUI 的 IPAdapter / 垫图 / 局部重绘等节点。</p>
    </div>
    <div class="hero-stats" aria-label="图库统计">
      <div class="stat"><strong id="statAssets">0</strong><span>张资产</span></div>
      <div class="stat"><strong id="statCats">0</strong><span>个品类</span></div>
    </div>
  </div>
</header>

<section class="controls" aria-label="图库筛选">
  <div class="shell controls-inner">
    <div class="line-tabs" id="lineTabs" role="tablist" aria-label="品类分类"></div>
    <div class="search-row">
      <label class="search-box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m20 20-4.2-4.2"/></svg>
        <input id="searchInput" type="search" placeholder="搜索资产名、ID 或品类" autocomplete="off" aria-label="搜索资产">
        <button class="search-clear" id="searchClear" type="button" aria-label="清空搜索" hidden><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
      </label>
    </div>
    <div class="active-filters" id="activeFilters" aria-label="当前筛选条件"></div>
  </div>
</section>

<main class="shell">
  <h2 class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)">服装资产列表</h2>
  <div class="result-head">
    <div class="result-summary"><strong id="resultCount">正在加载图库…</strong><span id="visibleCount"></span></div>
    <div class="result-hint"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M8 3H3v5m13-5h5v5M8 21H3v-5m13 5h5v-5"/><circle cx="12" cy="12" r="3"/></svg>点击卡片查看大图与详情</div>
  </div>
  <div class="grid" id="grid" aria-live="polite">
    <div class="asset-card skeleton"><div class="card-image"></div><div class="skeleton-line"></div><div class="skeleton-line short"></div></div>
    <div class="asset-card skeleton"><div class="card-image"></div><div class="skeleton-line"></div><div class="skeleton-line short"></div></div>
    <div class="asset-card skeleton"><div class="card-image"></div><div class="skeleton-line"></div><div class="skeleton-line short"></div></div>
    <div class="asset-card skeleton"><div class="card-image"></div><div class="skeleton-line"></div><div class="skeleton-line short"></div></div>
  </div>
  <button class="load-more" id="loadMore" type="button" hidden>加载更多</button>
</main>

<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-labelledby="viewerTitle" hidden>
  <section class="viewer-panel">
    <button class="viewer-close" id="viewerClose" type="button" aria-label="关闭大图"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
    <div class="viewer-stage" id="viewerStage">
      <img class="viewer-image" id="viewerImage" alt="" draggable="false">
      <span class="image-status" id="imageStatus" hidden>正在加载原图…</span>
    </div>
    <aside class="viewer-side">
      <div class="viewer-heading">
        <div class="viewer-eyebrow"><span id="viewerCategory">CATEGORY</span><span class="viewer-position" id="viewerPosition"></span></div>
        <h2 id="viewerTitle">资产详情</h2>
        <div class="id-row"><code class="viewer-id" id="viewerId"></code><button class="copy-btn" id="copyId" type="button">复制 ID</button></div>
      </div>
      <dl class="metadata" id="viewerMeta"></dl>
      <div class="download-stack">
        <button class="download-btn" id="useAsset" type="button">使用此资产 → ComfyUI</button>
        <a class="download-btn" id="downloadImage" href="#" download><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 3v12m-5-5 5 5 5-5M4 20h16"/></svg>下载原图 PNG</a>
        <a class="open-btn" id="openImage" href="#" target="_blank" rel="noopener noreferrer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M14 4h6v6m0-6-9 9M19 14v6H4V5h6"/></svg>新窗口打开</a>
      </div>
      <div class="keyboard-help"><kbd>←</kbd> <kbd>→</kbd> 切换资产　<kbd>Esc</kbd> 关闭 · 手机可左右滑动切换</div>
    </aside>
  </section>
</div>

<dialog class="info-dialog" id="infoDialog">
  <div class="info-head"><h2 id="infoTitle">使用指南</h2><button class="info-close" id="infoClose" type="button" aria-label="关闭"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
  <div class="info-content" id="infoContent"></div>
</dialog>

<script>
(() => {
'use strict';
const PAGE_SIZE = 96;
const state = { category: '', query: '', shown: PAGE_SIZE };
const $ = selector => document.querySelector(selector);
const grid = $('#grid');
const esc = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const format = value => Number(value).toLocaleString('zh-CN');
const icon = name => ({
  expand: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M8 3H3v5m13-5h5v5M8 21H3v-5m13 5h5v-5"/></svg>',
  search: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m20 20-4.2-4.2"/></svg>'
}[name] || '');

let DATA = [];
let CATS = [];
let currentList = [];
let renderedCount = 0;
const viewerState = { index: 0, item: null, token: 0, returnFocus: null };

function imgUrl(rel) { return './asset/img/' + encodeURIComponent(rel); }
function thumbUrl(rel) { return './asset/thumbs/' + encodeURIComponent(rel); }

function prepareData(data) {
  DATA = data.map(row => ({...row, '原图': imgUrl(row.原图), '缩略图': thumbUrl(row.缩略图)}));
  CATS = [...new Set(DATA.map(d => d.分类))];
  $('#statAssets').textContent = format(DATA.length);
  $('#statCats').textContent = format(CATS.length);
  renderTabs();
  render();
}

function renderTabs() {
  const tabs = [['', '全部', DATA.length], ...CATS.map(c => [c, c, DATA.filter(d => d.分类 === c).length])];
  $('#lineTabs').innerHTML = tabs.map(([value, label, count]) =>
    `<button class="line-tab" type="button" role="tab" data-cat="${esc(value)}" aria-selected="${state.category === value}"><span class="tab-name">${esc(label)}</span><span class="tab-count">${format(count)} 张</span></button>`).join('');
}

function hit(item) {
  return (!state.category || item.分类 === state.category) &&
         (!state.query || item.检索.includes(state.query));
}

function computeList() { return DATA.filter(hit); }

function cardImage(item, name) {
  return `<div class="card-image"><img class="main-image" src="${esc(item.缩略图)}" alt="${esc(name)}" loading="lazy" decoding="async"><div class="image-top"><span class="cat-tag">${esc(item.分类)}</span></div><span class="zoom-hint">${icon('expand')}</span></div>`;
}

function assetCard(item, index) {
  return `<article class="asset-card" tabindex="0" data-index="${index}" aria-label="${esc(item.名称)}，${esc(item.分类)}">${cardImage(item, item.名称)}<div class="card-body"><h3>${esc(item.名称)}</h3><code class="card-id">${esc(item.id)}</code></div></article>`;
}

function syncControls() {
  document.querySelectorAll('.line-tab').forEach(b => b.setAttribute('aria-selected', b.dataset.cat === state.category));
  $('#searchClear').hidden = !state.query;
  const count = [state.category].filter(Boolean).length + (state.query ? 1 : 0);
  $('#filterBadge') && ($('#filterBadge').textContent = count || '');
}

function renderActiveFilters() {
  const filters = [];
  if (state.category) filters.push(['category', `品类：${state.category}`]);
  if (state.query) filters.push(['query', `搜索：${state.query}`]);
  $('#activeFilters').innerHTML = filters.map(([key, label]) =>
    `<button class="filter-chip" type="button" data-clear="${key}" title="移除此筛选">${esc(label)}</button>`).join('');
}

function render(append = false) {
  if (!append) { currentList = computeList(); renderedCount = 0; grid.innerHTML = ''; }
  const total = currentList.length;
  const visible = currentList.slice(renderedCount, state.shown);
  grid.insertAdjacentHTML('beforeend', visible.map((item, offset) => assetCard(item, renderedCount + offset)).join(''));
  renderedCount += visible.length;
  $('#resultCount').textContent = `${format(total)} 张资产`;
  $('#visibleCount').textContent = total > state.shown ? `已显示 ${format(renderedCount)} / ${format(total)} 张` : `共 ${format(total)} 张`;
  if (!total) {
    grid.innerHTML = `<div class="empty"><div class="empty-icon">${icon('search')}</div><h3>没有找到匹配的资产</h3><p>试试更换关键词或减少筛选条件。</p><button type="button" id="emptyReset">清除全部筛选</button></div>`;
  }
  const more = $('#loadMore');
  more.hidden = renderedCount >= total || !total;
  more.textContent = `加载更多（剩余 ${format(total - renderedCount)} 张）`;
  syncControls();
  renderActiveFilters();
}

function resetView() { state.shown = PAGE_SIZE; render(); }
function resetAll() { state.category = ''; state.query = ''; $('#searchInput').value = ''; resetView(); }

$('#lineTabs').addEventListener('click', event => {
  const b = event.target.closest('.line-tab');
  if (!b || b.dataset.cat === state.category) return;
  state.category = b.dataset.cat;
  resetView();
});
$('#searchInput').addEventListener('input', event => {
  $('#searchClear').hidden = !event.target.value;
  clearTimeout(window.__st);
  window.__st = setTimeout(() => { state.query = event.target.value.trim().toLowerCase(); resetView(); }, 120);
});
$('#searchClear').addEventListener('click', () => { $('#searchInput').value = ''; state.query = ''; resetView(); $('#searchInput').focus(); });
$('#activeFilters').addEventListener('click', event => {
  const b = event.target.closest('button[data-clear]');
  if (!b) return;
  if (b.dataset.clear === 'category') state.category = '';
  if (b.dataset.clear === 'query') { state.query = ''; $('#searchInput').value = ''; }
  resetView();
});
grid.addEventListener('click', event => {
  if (event.target.closest('#emptyReset')) { resetAll(); return; }
  const card = event.target.closest('.asset-card[data-index]');
  if (!card) return;
  openViewer(Number(card.dataset.index));
});
grid.addEventListener('keydown', event => {
  if ((event.key === 'Enter' || event.key === ' ') && event.target.matches('.asset-card[data-index]')) {
    event.preventDefault(); openViewer(Number(event.target.dataset.index));
  }
});
$('#loadMore').addEventListener('click', () => { state.shown = Math.min(state.shown + PAGE_SIZE, currentList.length); render(true); });

function openViewer(index) {
  viewerState.index = index;
  viewerState.item = currentList[index];
  viewerState.returnFocus = document.activeElement;
  $('#viewer').hidden = false;
  document.body.classList.add('viewer-open');
  showViewer();
  $('#viewerClose').focus({ preventScroll: true });
}
function closeViewer() {
  if ($('#viewer').hidden) return;
  viewerState.token++;
  $('#viewer').hidden = true;
  document.body.classList.remove('viewer-open');
  if (viewerState.returnFocus && document.contains(viewerState.returnFocus)) viewerState.returnFocus.focus({ preventScroll: true });
}
function showViewer() {
  const item = viewerState.item;
  if (!item) return;
  const token = ++viewerState.token;
  const image = $('#viewerImage');
  image.src = item.缩略图;
  image.alt = item.名称;
  image.classList.add('is-loading');
  $('#imageStatus').textContent = '正在加载原图…';
  $('#imageStatus').hidden = false;
  const full = new Image();
  full.decoding = 'async';
  full.onload = () => { if (token !== viewerState.token) return; image.src = item.原图; image.classList.remove('is-loading'); $('#imageStatus').hidden = true; };
  full.onerror = () => { if (token !== viewerState.token) return; image.classList.remove('is-loading'); $('#imageStatus').textContent = '原图加载失败，可点击新窗口重试'; };
  full.src = item.原图;
  $('#viewerCategory').textContent = item.分类;
  $('#viewerPosition').textContent = `${viewerState.index + 1} / ${currentList.length}`;
  $('#viewerTitle').textContent = item.名称;
  $('#viewerId').textContent = item.id;
  $('#copyId').textContent = '复制 ID';
  $('#viewerMeta').innerHTML = [['品类', item.分类 || '—'], ['资产名', item.名称 || '—'], ['文件', item.文件名 || '—'], ['图片规格', '1366 × 2048 PNG']].map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join('');
  const dl = $('#downloadImage'); dl.href = item.原图; dl.setAttribute('download', `${item.名称}.png`);
  $('#openImage').href = item.原图;
}
function stepAsset(direction) {
  const next = viewerState.index + direction;
  if (next < 0 || next >= currentList.length) return;
  viewerState.index = next; viewerState.item = currentList[next]; showViewer();
}
$('#viewerClose').addEventListener('click', closeViewer);
$('#viewer').addEventListener('click', event => { if (event.target === $('#viewer')) closeViewer(); });
$('#copyId').addEventListener('click', async () => { try { await navigator.clipboard.writeText(viewerState.item.id); $('#copyId').textContent = '已复制'; } catch { $('#copyId').textContent = '请手动复制'; } });
let touchStart = null;
$('#viewerStage').addEventListener('touchstart', event => { const t = event.touches[0]; touchStart = { x: t.clientX, y: t.clientY }; }, { passive: true });
$('#viewerStage').addEventListener('touchend', event => {
  if (!touchStart) return; const t = event.changedTouches[0]; const dx = t.clientX - touchStart.x, dy = t.clientY - touchStart.y;
  if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)) stepAsset(dx < 0 ? 1 : -1);
  touchStart = null;
}, { passive: true });
document.addEventListener('keydown', event => {
  if (!$('#viewer').hidden) {
    if (event.key === 'Escape') closeViewer();
    else if (event.key === 'ArrowRight') stepAsset(1);
    else if (event.key === 'ArrowLeft') stepAsset(-1);
    return;
  }
  if (event.key === '/' && !['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)) { event.preventDefault(); $('#searchInput').focus(); }
});

// ComfyUI bridge. Selection only, never queues or alters other nodes.
$('#useAsset').addEventListener('click', () => {
  if (!viewerState.item) return;
  const id = viewerState.item.id;
  if (window.parent !== window) {
    window.parent.postMessage({ type: 'clothing-gallery-select', id }, location.origin);
  } else {
    $('#useAsset').textContent = '当前资产 ID：' + id + '（请从 ComfyUI 节点打开以应用）';
  }
});
window.addEventListener('message', event => {
  if (event.origin !== location.origin || event.source !== window.parent || event.data?.type !== 'clothing-gallery-current') return;
  const current = DATA.find(item => item.id === event.data.id);
  if (current) $('#useAsset').title = '当前节点：' + current.id;
});
window.parent.postMessage({ type: 'clothing-gallery-ready' }, location.origin);

fetch('./catalog')
  .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
  .then(prepareData)
  .catch(err => {
    console.error(err);
    $('#resultCount').textContent = '图库加载失败';
    grid.innerHTML = '<div class="empty"><h3>无法读取服装数据</h3><p>请确认通过 HTTP 服务访问页面，并检查 data/clothing-zh.json 是否存在（运行 python scripts/build_library.py 生成）。</p><button type="button" onclick="location.reload()">重新加载</button></div>';
  });
})();
</script>
</body>
</html>
